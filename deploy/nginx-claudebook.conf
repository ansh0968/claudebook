# Managed by ClaudeBook deploy (deploy/setup-server.sh). Edits here are overwritten.
server {
    listen 80;
    listen [::]:80;
    server_name book.clarifiq.in;

    location /.well-known/acme-challenge/ { root /var/www/claudebook-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name book.clarifiq.in;

    ssl_certificate     /etc/letsencrypt/live/book.clarifiq.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/book.clarifiq.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:claudebook_ssl:10m;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_claudebook;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

map $http_upgrade $connection_upgrade_claudebook {
    default upgrade;
    ''      close;
}
