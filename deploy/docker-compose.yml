# Only the ClaudeBook API runs here. The host's existing nginx terminates HTTPS and proxies to it,
# so nothing else on the box (other sites, bots, game servers) is touched.
name: claudebook

services:
  server:
    build: ../server
    image: claudebook-server:latest
    restart: unless-stopped
    environment:
      CLAUDEBOOK_SECRET: ${CLAUDEBOOK_SECRET:?set CLAUDEBOOK_SECRET in deploy/.env}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data:Z
