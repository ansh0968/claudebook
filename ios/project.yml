name: ClaudeBook
options:
  bundleIdPrefix: in.clarifiq
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClaudeBook:
    type: application
    platform: iOS
    sources: [ClaudeBook]
    scheme:
      testTargets:
        - ClaudeBookTests
        - ClaudeBookUITests
    info:
      path: ClaudeBook/Info.plist
      properties:
        # Lets the CI simulator test talk to a plain-http server on localhost. Real traffic stays HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.clarifiq.claudebook
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ClaudeBook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: NO
  ClaudeBookTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ClaudeBookTests]
    dependencies:
      - target: ClaudeBook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ClaudeBookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ClaudeBookUITests]
    dependencies:
      - target: ClaudeBook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: ClaudeBookUITests/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
