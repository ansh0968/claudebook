name: Deploy server

on:
  push:
    branches: [main]
    paths: ["server/**", "deploy/**", ".github/workflows/deploy-server.yml"]
  workflow_dispatch:
    inputs:
      reveal_secret:
        description: "Print the app secret, encrypted to the maintainer's age key"
        type: boolean
        default: false

concurrency: deploy-server

env:
  OPS_RECIPIENT: age1a9yamstrp6nka68la6hh6xrecxn74atuxag9l68k5etgp4zq04ss0rr0hv

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install typst + poppler so the PDF checks run
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq poppler-utils >/dev/null
          curl -fsSL https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz | tar xJ -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
      - working-directory: server
        run: |
          npm ci
          npm run build
          CLAUDEBOOK_SECRET=ci-secret-0123456789 DATA_DIR=$RUNNER_TEMP/data node dist/index.js &
          sleep 2
          CLAUDEBOOK_SECRET=ci-secret-0123456789 npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ship to the Oracle server
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          CLAUDEBOOK_SECRET: ${{ secrets.CLAUDEBOOK_SECRET }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/id && chmod 600 ~/.ssh/id
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/id -o BatchMode=yes $USER@$HOST"
          tar czf - --exclude node_modules --exclude dist server deploy | $SSH "mkdir -p ~/claudebook && tar xzf - -C ~/claudebook"
          printf '%s' "$CLAUDEBOOK_SECRET" | $SSH 'CLAUDEBOOK_SECRET=$(cat) bash ~/claudebook/deploy/setup-server.sh'
      - name: Reveal app secret (encrypted)
        if: inputs.reveal_secret
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz | tar xz -C /tmp
          ssh -i ~/.ssh/id -o BatchMode=yes "$USER@$HOST" "grep '^CLAUDEBOOK_SECRET=' ~/claudebook/deploy/.env" | /tmp/age/age -r "$OPS_RECIPIENT" -a
      - name: Health check over HTTPS
        run: |
          for i in $(seq 1 20); do
            curl -fsS https://book.clarifiq.in/health && exit 0
            sleep 6
          done
          echo "Server did not come up on https://book.clarifiq.in" && exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify from outside (read-only)
        working-directory: server
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
        run: |
          npm ci --silent
          SECRET=$(ssh -i ~/.ssh/id -o BatchMode=yes "$USER@$HOST" "sed -n 's/^CLAUDEBOOK_SECRET=//p' ~/claudebook/deploy/.env")
          echo "::add-mask::$SECRET"
          CLAUDEBOOK_URL=https://book.clarifiq.in CLAUDEBOOK_SECRET="$SECRET" npx tsx src/verify.ts
      - name: Existing sites still answer
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://dash.clarifiq.in/)
          echo "dash.clarifiq.in -> $code"
          case "$code" in 2*|3*|401|403) ;; *) echo "dash.clarifiq.in looks broken"; exit 1;; esac
