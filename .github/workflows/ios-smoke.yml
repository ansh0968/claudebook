name: iPad smoke test

# Builds the app for the simulator, points it at a throwaway local server, has "Claude" draw on the
# open page, and saves screenshots to the ci-screenshots branch so they can be reviewed without a Mac.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-smoke.yml"]
  workflow_dispatch:

concurrency: ios-smoke

permissions:
  contents: write

env:
  SECRET: smoke-test-secret-0123456789
  BASE: http://127.0.0.1:8787

jobs:
  smoke:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start a throwaway server
        working-directory: server
        run: |
          brew install typst poppler
          npm ci
          npm run build
          CLAUDEBOOK_SECRET=$SECRET DATA_DIR=$RUNNER_TEMP/data nohup node dist/index.js > $RUNNER_TEMP/server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS $BASE/health && break; sleep 1; done
      - name: Build for simulator
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          set -o pipefail
          xcodebuild -project ClaudeBook.xcodeproj -scheme ClaudeBook -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || { tail -100 build.log; exit 1; }
          grep -E "error:|warning:|BUILD" build.log || true
          test -d build/Build/Products/Debug-iphonesimulator/ClaudeBook.app
      - name: Run on an iPad simulator
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("iPad Pro"))][0].udid')
          echo "Using $(xcrun simctl list devices | grep $UDID)"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/ClaudeBook.app
          mkdir -p shots
          export SIMCTL_CHILD_CLAUDEBOOK_SERVER=$BASE SIMCTL_CHILD_CLAUDEBOOK_SECRET=$SECRET
          xcrun simctl launch "$UDID" in.clarifiq.claudebook
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/1-library.png
          xcrun simctl terminate "$UDID" in.clarifiq.claudebook
          # "Claude" makes a two-page worksheet PDF; open it so the app has to render PDF pages.
          printf '#set page(paper: "a4")\n= Practice sheet\n\n*1.* Solve $x^2 - 5x + 6 = 0$.\n#v(9cm)\n*2.* Sketch $y = sin x$ for $0 <= x <= 2 pi$.\n#pagebreak()\n*3.* Differentiate $f(x) = x^3 e^x$.\n' > /tmp/sheet.typ
          jq -n --rawfile t /tmp/sheet.typ '{jsonrpc:"2.0",id:2,method:"tools/call",params:{name:"create_pdf",arguments:{title:"Worksheet",typst:$t}}}' \
            | curl -fsS -X POST "$BASE/mcp/$SECRET" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d @- | jq -r '.result.content[0].text'
          api() { curl -fsS -H "Authorization: Bearer $SECRET" "$BASE/api/$1"; }
          mcp() { curl -fsS -X POST "$BASE/mcp/$SECRET" -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' -d "$1" | jq -r '.result.content[0].text // .'; }
          PDF_NB=$(api notebooks | jq -r '.notebooks[] | select(.title=="Worksheet") | .id')
          PAGE1=$(api notebooks/$PDF_NB | jq -r '.pages[0].id')
          PAGE2=$(api notebooks/$PDF_NB | jq -r '.pages[1].id')
          curl -fsS -X POST -H "Authorization: Bearer $SECRET" -H 'Content-Type: application/json' -d "{\"notebookId\":\"$PDF_NB\",\"pageId\":\"$PAGE1\"}" $BASE/api/view; echo
          export SIMCTL_CHILD_CLAUDEBOOK_AUTOOPEN=1 SIMCTL_CHILD_CLAUDEBOOK_TEST_STROKE=1
          xcrun simctl launch "$UDID" in.clarifiq.claudebook
          sleep 10
          xcrun simctl io "$UDID" screenshot shots/2-editor.png
          # Claude draws on whatever page the app reported as open.
          mcp '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"draw_on_page","arguments":{"items":[
            {"type":"ellipse","center":[500,700],"rx":190,"ry":190,"color":"#E5484D"},
            {"type":"arrow","from":[850,300],"to":[640,560]},
            {"type":"text","x":560,"y":220,"text":"Claude was here","size":40},
            {"type":"highlight","x":80,"y":1000,"w":500,"h":60},
            {"type":"math","latex":"x = \\frac{5 \\pm 1}{2} \\Rightarrow x \\in \\{2, 3\\}","x":120,"y":330,"size":40,"color":"#30A46C"},
            {"type":"text","x":120,"y":1150,"text":"black ink check","size":36,"color":"black"},
            {"type":"path","points":[[100,1200],[250,1120],[400,1220],[550,1130],[700,1210]],"color":"#30A46C","width":5}]}}}'
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/3-claude-drew.png
          # What the server (and so Claude) sees for each page, built from the app's uploaded snapshots.
          echo "view: $(api notebooks | jq -c .view) (page 1 is $PAGE1)"
          api "pages/$PAGE1/render.png?grid=1" > shots/4-server-page1.png
          api "pages/$PAGE2/render.png?grid=1" > shots/4b-server-page2.png
          DATA=$(xcrun simctl get_app_container "$UDID" in.clarifiq.claudebook data)
          echo "local ink files:"; ls -l "$DATA/Library/Application Support/drawings" || true
          # Dark mode follows the iPad by default; Claude's snapshot must stay light.
          xcrun simctl ui "$UDID" appearance dark
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/5-dark.png
          xcrun simctl ui "$UDID" appearance light
          # Scroll test: stop 500 units above page 2 so the bottom of page 1 and the top of page 2 are both on screen.
          xcrun simctl terminate "$UDID" in.clarifiq.claudebook
          unset SIMCTL_CHILD_CLAUDEBOOK_TEST_STROKE
          export SIMCTL_CHILD_CLAUDEBOOK_TEST_SCROLL=942
          xcrun simctl launch "$UDID" in.clarifiq.claudebook
          sleep 12
          xcrun simctl io "$UDID" screenshot shots/6-scrolled.png
          echo "local ink files after relaunch:"; ls -l "$DATA/Library/Application Support/drawings" || true
          echo "view after scrolling: $(api notebooks | jq -c .view) (page 2 is $PAGE2)"
          mcp '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"draw_on_page","arguments":{"items":[
            {"type":"rect","x":90,"y":120,"w":820,"h":200,"color":"#3B82F6"},
            {"type":"text","x":560,"y":360,"text":"page 2!","size":44}]}}}'
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/7-claude-page2.png
          # Claude inserts a page at the start: everything on screen should stay put, ink included.
          mcp "{\"jsonrpc\":\"2.0\",\"id\":4,\"method\":\"tools/call\",\"params\":{\"name\":\"add_pages\",\"arguments\":{\"notebook_id\":\"$PDF_NB\",\"after_page\":0,\"background\":\"lined\"}}}"
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/8-page-inserted.png
          api notebooks/$PDF_NB | jq -c '[.pages[] | {id, pdf: .pdf.page, claude: (.claudeLayer | length), v: .snapshotVersion}]'
          xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "ClaudeBook" AND messageType >= 16' | tail -40 || true
          echo "--- server log"; tail -20 $RUNNER_TEMP/server.log
      - name: Chemistry tools and refreshed UI
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("iPad Pro"))][0].udid')
          xcrun simctl terminate "$UDID" in.clarifiq.claudebook || true
          node ../scripts/smoke-fixture.mjs
          export SIMCTL_CHILD_CLAUDEBOOK_SERVER=$BASE SIMCTL_CHILD_CLAUDEBOOK_SECRET=$SECRET
          export SIMCTL_CHILD_CLAUDEBOOK_AUTOOPEN=1
          xcrun simctl launch "$UDID" in.clarifiq.claudebook
          sleep 10
          xcrun simctl io "$UDID" screenshot shots/9-chemistry-tools.png
          TEST_RUNNER_CLAUDEBOOK_SERVER=$BASE TEST_RUNNER_CLAUDEBOOK_SECRET=$SECRET \
            xcodebuild -project ClaudeBook.xcodeproj -scheme ClaudeBook -configuration Debug \
            -destination "id=$UDID" -derivedDataPath test-build -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test > ui-test.log 2>&1 \
            || { tail -150 ui-test.log; exit 1; }
          node ../scripts/smoke-fixture.mjs reveal
          xcrun simctl terminate "$UDID" in.clarifiq.claudebook || true
          xcrun simctl launch "$UDID" in.clarifiq.claudebook
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/10-hint-revealed.png
          xcrun simctl ui "$UDID" appearance dark
          sleep 3
          xcrun simctl io "$UDID" screenshot shots/11-chemistry-dark.png
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl terminate "$UDID" in.clarifiq.claudebook
          unset SIMCTL_CHILD_CLAUDEBOOK_AUTOOPEN
          xcrun simctl launch "$UDID" in.clarifiq.claudebook
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/12-library-refreshed.png
          # Folders and scratch pads, reached through a test route since CI can't tap.
          shot() {
            xcrun simctl terminate "$UDID" in.clarifiq.claudebook || true
            SIMCTL_CHILD_CLAUDEBOOK_TEST_ROUTE="$1" xcrun simctl launch "$UDID" in.clarifiq.claudebook
            sleep "${3:-5}"
            xcrun simctl io "$UDID" screenshot "shots/$2.png"
          }
          shot "folder:Chemistry" 14-folder
          shot "folder:Organic" 15-subfolder
          shot "scratch" 16-scratch-pads
          shot "notebook:Scratch · quick" 17-scratch-editor 8
          xcrun simctl ui "$UDID" appearance dark
          shot "" 18-library-dark
          shot "scratch" 19-scratch-pads-dark
          xcrun simctl ui "$UDID" appearance light
          # First-run screen, as seen after a fresh install (empty secret, nothing in the Keychain).
          xcrun simctl terminate "$UDID" in.clarifiq.claudebook
          SIMCTL_CHILD_CLAUDEBOOK_SECRET= xcrun simctl launch "$UDID" in.clarifiq.claudebook
          sleep 4
          xcrun simctl io "$UDID" screenshot shots/13-setup.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-smoke-screenshots
          path: ios/shots/*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-build-log
          path: ios/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-interaction-test-results
          path: |
            ios/ui-test.log
            ios/TestResults.xcresult
      - name: Publish screenshots to ci-screenshots branch
        if: always()
        working-directory: ios
        run: |
          [ -d shots ] || exit 0
          cp -R shots $RUNNER_TEMP/shots
          cd $RUNNER_TEMP && rm -rf pub && mkdir pub && cd pub
          git init -q -b ci-screenshots
          cp ../shots/*.png .
          echo "Smoke test for ${GITHUB_SHA::7}, run $GITHUB_RUN_ID" > README.md
          git add . && git -c user.name=claudebook-ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
